# On the VPS: only `app` runs. It joins the shared `web-network`, and the Caddy
# in ~/sites/caddy reaches it as cp-trainer:3333 (see docs/deploy.md).
#
# Locally: `docker compose --profile local up -d --build` also starts a Caddy of
# our own, so you can test the full HTTPS path at https://localhost.
# One-time setup on any machine: docker network create web-network
services:
  app:
    build: .
    container_name: cp-trainer
    restart: unless-stopped
    init: true
    env_file: .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DB_PATH: /data/app.db
      CONTENT_DIR: /content
    volumes:
      - app_data:/data
      # The content repo checked out next to this one (on the VPS:
      # ~/sites/cp-trainer/cp-trainer-content). Override with CONTENT_PATH if it lives elsewhere.
      - ${CONTENT_PATH:-../cp-trainer-content}:/content:ro
    expose: ['3333']
    networks: [web-network]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Local testing only. On the VPS the shared Caddy owns ports 80/443.
  caddy:
    profiles: [local]
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    env_file: .env.docker # Caddy reads APP_URL as its site address
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web-network]
    depends_on: [app]

volumes:
  app_data: {}
  caddy_data: {}
  caddy_config: {}

networks:
  web-network:
    external: true
