<div id="problem-body"><p>You have to determine whether a given number $N$ is prime or not.</p><h3>Input</h3><p>First line contains $T$, the number of test cases.<br>Then $T$ lines follow.</p><h3>Output</h3><p>For each test case print YES or NO.</p><h3>Example</h3><pre><strong>Input:</strong>
1
2</pre></div>
